name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # The release workflow runs this first, on the tagged commit.
  workflow_call:

jobs:
  verify:
    name: Lint, typecheck, test, build, pack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.13, 24]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check
      - run: yarn build
      - run: yarn test
      - name: npm pack installs and runs
        run: yarn test:pack
